    <script>
        // ----------------------------------------------------
        // 食材商品資料 (Product Items Catalog)
        // ----------------------------------------------------
        const products = [
            {
                id: 'PROD_001',

            },
            {

                image: 'https://images.unsplash.com/photo-1594282486552-05b4d80fbb9f?auto=format&fit=crop&w=600&q=80',
                description: '高海拔清甜爽口，葉片翠綠緊實，不論炒食、煮火鍋或涼拌皆能完美展現天然甘甜。'
            },
            {
                id: 'PROD_003',
                name: '有機 溫室牛頭番茄',
                category: 'vegetables',
                categoryName: '新鮮蔬菜',
                price: 89,
                unit: '600g / 盒',
                badge: '有機驗證',
                badgeBg: 'bg-emerald-600',
                image: 'https://images.unsplash.com/photo-1592924357228-91a4daadcfea?auto=format&fit=crop&w=600&q=80',
                description: '有機農場細心栽培，飽滿多汁濃郁，茄紅素豐富，沙拉與羅宋湯的極佳首選。'
            },
            {
                id: 'PROD_004',
                name: '澳洲 M9+ 和牛燒肉片',
                category: 'meats',
                categoryName: '精選肉品海鮮',
                price: 380,
                unit: '200g / 包',
                badge: '頂級冷藏',
                badgeBg: 'bg-amber-600',
                image: 'https://images.unsplash.com/photo-1603048588665-791ca8aea617?auto=format&fit=crop&w=600&q=80',
                description: '細緻大理石紋油花，入口即化帶著極致醇厚肉香，輕煎即可感受迷人滋味。'
            },
            {
                id: 'PROD_005',
                name: '挪威 空運生鮮鮭魚切片',
                category: 'meats',
                categoryName: '精選肉品海鮮',
                price: 240,
                unit: '300g / 厚切',
                badge: '產地空運',
                badgeBg: 'bg-sky-600',
                image: 'https://images.unsplash.com/photo-1519708227418-c8fd9a32b7a2?auto=format&fit=crop&w=600&q=80',
                description: '挪威冷冽海域養殖，油脂勻稱富含 Omega-3，乾煎香氣四溢，健康美味。'
            },
            {
                id: 'PROD_006',
                name: '紐西蘭 黃金奇異果',
                category: 'fruits',
                categoryName: '盛夏水果',
                price: 150,
                unit: '6入 / 盒',
                badge: '維他命C之王',
                badgeBg: 'bg-amber-500',
                image: 'https://images.unsplash.com/photo-1618897996318-5a901fa6ca71?auto=format&fit=crop&w=600&q=80',
                description: '果肉陽光黃澄，口感香甜多汁綿密，補充一日健康元氣最佳水果。'
            }
        ];

        // Global Shopping Cart State
        let cart = [];
        let activeCategory = 'all';

        // ----------------------------------------------------
        // GA4 4大核心監控事件 (Background Tracking)
        // ----------------------------------------------------

        // 監控事件 1: 查看商品 (view_item)
        function trackViewItem(product) {
            if (typeof window.gtag === 'function') {
                window.gtag('event', 'view_item', {
                    currency: 'TWD',
                    value: product.price,
                    items: [{
                        item_id: product.id,
                        item_name: product.name,
                        item_category: product.categoryName,
                        price: product.price,
                        quantity: 1
                    }]
                });
            }
        }

        // 監控事件 2: 加入購物車 (add_to_cart)
        function trackAddToCart(product, quantity = 1) {
            if (typeof window.gtag === 'function') {
                window.gtag('event', 'add_to_cart', {
                    currency: 'TWD',
                    value: product.price * quantity,
                    items: [{
                        item_id: product.id,
                        item_name: product.name,
                        item_category: product.categoryName,
                        price: product.price,
                        quantity: quantity
                    }]
                });
            }
        }

        // 監控事件 3: 看購物車 (view_cart)
        function trackViewCart() {
            if (typeof window.gtag === 'function') {
                const totalValue = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
                window.gtag('event', 'view_cart', {
                    currency: 'TWD',
                    value: totalValue,
                    items: cart.map(item => ({
                        item_id: item.id,
                        item_name: item.name,
                        item_category: item.categoryName,
                        price: item.price,
                        quantity: item.quantity
                    }))
                });
            }
        }

        // 監控事件 4: 從購物車移出 (remove_from_cart)
        function trackRemoveFromCart(product, quantity = 1) {
            if (typeof window.gtag === 'function') {
                window.gtag('event', 'remove_from_cart', {
                    currency: 'TWD',
                    value: product.price * quantity,
                    items: [{
                        item_id: product.id,
                        item_name: product.name,
                        item_category: product.categoryName,
                        price: product.price,
                        quantity: quantity
                    }]
                });
            }
        }

        // ----------------------------------------------------
        // UI 畫面繪製與互動控制
        // ----------------------------------------------------

        window.addEventListener('DOMContentLoaded', () => {
            renderProducts(products);
            updateCartUI();
        });

        // 繪製商品列表
        function renderProducts(productList) {
            const grid = document.getElementById('productGrid');
            
            if (productList.length === 0) {
                grid.innerHTML = `
                    <div class="col-span-full text-center py-12 text-slate-400">
                        <i class="fa-solid fa-magnifying-glass text-3xl mb-3"></i>
                        <p>找不到符合條件的食材商品</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = productList.map(product => `
                <div class="bg-white rounded-3xl overflow-hidden border border-slate-100 shadow-sm hover:shadow-xl transition-all duration-300 flex flex-col group">
                    <div class="relative h-48 overflow-hidden bg-slate-100 cursor-pointer" onclick="openProductModal('${product.id}')">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <span class="absolute top-3 left-3 text-white text-[11px] font-bold px-2.5 py-1 rounded-full ${product.badgeBg} shadow-sm">
                            ${product.badge}
                        </span>
                        <div class="absolute inset-0 bg-slate-900/20 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span class="bg-white/90 backdrop-blur-md text-slate-800 text-xs font-bold px-3.5 py-1.5 rounded-full shadow">
                                <i class="fa-regular fa-eye mr-1"></i> 查看詳情
                            </span>
                        </div>
                    </div>

                    <div class="p-5 flex-1 flex flex-col justify-between">
                        <div>
                            <div class="text-[11px] text-brand-600 font-semibold mb-1 uppercase tracking-wider">${product.categoryName}</div>
                            <h3 onclick="openProductModal('${product.id}')" class="font-bold text-slate-800 text-base group-hover:text-brand-600 transition-colors cursor-pointer line-clamp-1">
                                ${product.name}
                            </h3>
                            <p class="text-xs text-slate-400 mt-1">${product.unit}</p>
                        </div>

                        <div class="mt-4 pt-3 border-t border-slate-50 flex items-center justify-between">
                            <div>
                                <span class="text-xs text-slate-400">售價</span>
                                <div class="text-lg font-extrabold text-slate-900">NT$ ${product.price}</div>
                            </div>
                            
                            <button onclick="addToCartDirect('${product.id}')" class="bg-brand-50 hover:bg-brand-500 hover:text-white text-brand-700 px-3.5 py-2 rounded-xl font-semibold transition-all duration-200 flex items-center gap-1.5 text-xs">
                                <i class="fa-solid fa-cart-plus text-sm"></i>
                                <span>加入</span>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        // 開啟商品詳情彈窗 (觸發 view_item)
        function openProductModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            // GA4 追蹤：查看商品
            trackViewItem(product);

            const modalContent = document.getElementById('modalContent');
            modalContent.innerHTML = `
                <div class="relative">
                    <button onclick="closeProductModal()" class="absolute top-4 right-4 z-10 bg-black/40 hover:bg-black/60 text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                    <div class="h-64 sm:h-72 w-full overflow-hidden bg-slate-100">
                        <img src="${product.image}" alt="${product.name}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-6">
                        <div class="flex items-center gap-2 mb-2">
                            <span class="text-xs font-bold px-2.5 py-0.5 rounded-full ${product.badgeBg} text-white">${product.badge}</span>
                            <span class="text-xs text-slate-500 font-medium">${product.categoryName}</span>
                        </div>
                        <h2 class="text-2xl font-bold text-slate-900">${product.name}</h2>
                        <p class="text-sm text-slate-500 mt-2 leading-relaxed">${product.description}</p>
                        
                        <div class="my-6 p-4 bg-slate-50 rounded-2xl flex items-center justify-between">
                            <div>
                                <span class="text-xs text-slate-400 block">規格：${product.unit}</span>
                                <span class="text-2xl font-extrabold text-brand-600">NT$ ${product.price}</span>
                            </div>
                            
                            <!-- 數量選擇器 -->
                            <div class="flex items-center border border-slate-200 bg-white rounded-xl overflow-hidden shadow-sm">
                                <button onclick="adjustModalQty(-1)" class="px-3.5 py-1.5 text-slate-600 hover:bg-slate-100 transition-colors font-bold">-</button>
                                <span id="modalQty" class="px-4 text-sm font-bold text-slate-800">1</span>
                                <button onclick="adjustModalQty(1)" class="px-3.5 py-1.5 text-slate-600 hover:bg-slate-100 transition-colors font-bold">+</button>
                            </div>
                        </div>

                        <button onclick="confirmAddToCartFromModal('${product.id}')" class="w-full bg-brand-600 hover:bg-brand-700 text-white py-3.5 rounded-2xl font-bold shadow-lg shadow-brand-600/30 transition-all flex items-center justify-center gap-2">
                            <i class="fa-solid fa-cart-plus"></i> 加入購物車
                        </button>
                    </div>
                </div>
            `;

            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        let modalQtyVal = 1;
        function adjustModalQty(delta) {
            modalQtyVal = Math.max(1, modalQtyVal + delta);
            const qtyEl = document.getElementById('modalQty');
            if (qtyEl) qtyEl.innerText = modalQtyVal;
        }

        function confirmAddToCartFromModal(productId) {
            const product = products.find(p => p.id === productId);
            if (!product) return;

            addToCart(product, modalQtyVal);
            closeProductModal();
            modalQtyVal = 1;
        }

        // 直接從卡片加入購物車
        function addToCartDirect(productId) {
            const product = products.find(p => p.id === productId);
            if (product) {
                addToCart(product, 1);
            }
        }

        // 購物車新增項目
        function addToCart(product, quantity) {
            const existingIndex = cart.findIndex(item => item.id === product.id);
            
            if (existingIndex > -1) {
                cart[existingIndex].quantity += quantity;
            } else {
                cart.push({
                    ...product,
                    quantity: quantity
                });
            }

            // GA4 追蹤：加入購物車
            trackAddToCart(product, quantity);

            updateCartUI();
            showToast(`已成功將「${product.name}」加入購物車`);
        }

        // 購物車數量變更 / 減少
        function updateCartItemQty(productId, delta) {
            const index = cart.findIndex(item => item.id === productId);
            if (index === -1) return;

            const currentItem = cart[index];

            if (delta < 0 && currentItem.quantity === 1) {
                // GA4 追蹤：從購物車移出
                trackRemoveFromCart(currentItem, 1);
                cart.splice(index, 1);
            } else if (delta < 0) {
                // GA4 追蹤：從購物車移出 (數量 -1)
                trackRemoveFromCart(currentItem, 1);
                currentItem.quantity -= 1;
            } else {
                // GA4 追蹤：加入購物車 (數量 +1)
                trackAddToCart(currentItem, 1);
                currentItem.quantity += 1;
            }

            updateCartUI();
            renderCartDrawerItems();
        }

        // 完全移除購物車品項
        function removeCartItemCompletely(productId) {
            const index = cart.findIndex(item => item.id === productId);
            if (index > -1) {
                const item = cart[index];
                // GA4 追蹤：從購物車移出 (全部數量)
                trackRemoveFromCart(item, item.quantity);
                cart.splice(index, 1);
                updateCartUI();
                renderCartDrawerItems();
            }
        }

        // 更新購物車 Header 數字標籤
        function updateCartUI() {
            const totalCount = cart.reduce((sum, item) => sum + item.quantity, 0);
            const badge = document.getElementById('cartBadge');
            const cartItemCountTag = document.getElementById('cartItemCountTag');

            if (totalCount > 0) {
                badge.innerText = totalCount;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }

            if (cartItemCountTag) {
                cartItemCountTag.innerText = `${totalCount} 項商品`;
            }
        }

        // 開啟購物車側邊抽屜 (觸發 view_cart)
        function openCartDrawer() {
            renderCartDrawerItems();
            document.getElementById('cartDrawer').classList.remove('hidden');
            
            // GA4 追蹤：看購物車
            trackViewCart();
        }

        function closeCartDrawer() {
            document.getElementById('cartDrawer').classList.add('hidden');
        }

        // 繪製購物車抽屜內容
        function renderCartDrawerItems() {
            const container = document.getElementById('cartItemsContainer');
            const subtotalEl = document.getElementById('cartSubtotal');
            const shippingEl = document.getElementById('cartShipping');
            const totalEl = document.getElementById('cartTotal');

            if (cart.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-400">
                        <i class="fa-solid fa-basket-shopping text-4xl mb-3 opacity-40"></i>
                        <p class="font-semibold text-slate-600">您的購物車是空的</p>
                        <p class="text-xs mt-1">快去挑選新鮮的優質食材吧！</p>
                    </div>
                `;
                subtotalEl.innerText = 'NT$ 0';
                shippingEl.innerText = 'NT$ 0';
                totalEl.innerText = 'NT$ 0';
                return;
            }

            const subtotal = cart.reduce((sum, item) => sum + (item.price * item.quantity), 0);
            const shipping = subtotal >= 888 || subtotal === 0 ? 0 : 100;
            const total = subtotal + shipping;

            container.innerHTML = cart.map(item => `
                <div class="flex items-center gap-3 p-3 bg-slate-50 rounded-2xl border border-slate-100">
                    <img src="${item.image}" alt="${item.name}" class="w-16 h-16 rounded-xl object-cover bg-white">
                    <div class="flex-1 min-w-0">
                        <h4 class="font-bold text-slate-800 text-sm truncate">${item.name}</h4>
                        <div class="text-xs text-brand-600 font-extrabold mt-0.5">NT$ ${item.price}</div>
                        
                        <div class="flex items-center justify-between mt-2">
                            <div class="flex items-center border border-slate-200 bg-white rounded-lg overflow-hidden text-xs">
                                <button onclick="updateCartItemQty('${item.id}', -1)" class="px-2.5 py-1 text-slate-600 hover:bg-slate-100 font-bold">-</button>
                                <span class="px-2.5 font-bold text-slate-800">${item.quantity}</span>
                                <button onclick="updateCartItemQty('${item.id}', 1)" class="px-2.5 py-1 text-slate-600 hover:bg-slate-100 font-bold">+</button>
                            </div>

                            <button onclick="removeCartItemCompletely('${item.id}')" class="text-slate-400 hover:text-rose-500 text-xs transition-colors p-1" title="移除商品">
                                <i class="fa-solid fa-trash-can"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `).join('');

            subtotalEl.innerText = `NT$ ${subtotal}`;
            shippingEl.innerText = shipping === 0 ? '免運費' : `NT$ ${shipping}`;
            totalEl.innerText = `NT$ ${total}`;
        }

        // 分類過濾功能
        function filterCategory(cat) {
            activeCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(btn => {
                btn.classList.remove('bg-brand-600', 'text-white', 'shadow-sm');
                btn.classList.add('bg-white', 'border', 'border-slate-200', 'text-slate-600');
            });

            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.classList.remove('bg-white', 'border', 'border-slate-200', 'text-slate-600');
                activeBtn.classList.add('bg-brand-600', 'text-white', 'shadow-sm');
            }

            if (cat === 'all') {
                renderProducts(products);
            } else {
                renderProducts(products.filter(p => p.category === cat));
            }
        }

        // 搜尋功能
        function handleSearch() {
            const query = document.getElementById('searchInput').value.trim().toLowerCase();
            executeSearch(query);
        }

        function handleMobileSearch() {
            const query = document.getElementById('mobileSearchInput').value.trim().toLowerCase();
            executeSearch(query);
        }

        function executeSearch(query) {
            if (!query) {
                filterCategory(activeCategory);
                return;
            }

            const filtered = products.filter(p => 
                p.name.toLowerCase().includes(query) || 
                p.description.toLowerCase().includes(query) ||
                p.categoryName.toLowerCase().includes(query)
            );
            renderProducts(filtered);
        }

        // 結帳成功模擬
        function checkoutMock() {
            if (cart.length === 0) {
                showToast('您的購物車是空的！');
                return;
            }
            
            cart = [];
            updateCartUI();
            closeCartDrawer();
            
            document.getElementById('checkoutModal').classList.remove('hidden');
        }

        function closeCheckoutModal() {
            document.getElementById('checkoutModal').classList.add('hidden');
        }

        // Toast 訊息提示元件
        function showToast(msg) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMessage');
            
            toastMsg.innerText = msg;
            toast.classList.remove('translate-y-[-100px]', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');

            setTimeout(() => {
                toast.classList.remove('translate-y-0', 'opacity-100');
                toast.classList.add('translate-y-[-100px]', 'opacity-0');
            }, 2500);
        }
    </script>
</body>
</html>
